name: Organizar y optimizar contenido del panel

# Se dispara solo con cada push a main que toque fotos/video de deptos o
# sus fichas de datos - ya sea desde el panel (Sveltia comitea directo a
# main vía la API de GitHub) o desde un push normal de la agencia.
on:
  push:
    branches: [main]
    paths:
      - "public/departamentos/**"
      - "src/data/departamentos/**"
      - "public/hero/**"
      - "public/inicio/**"
      - "public/nosotros/**"
      - "public/resenas/**"

# Sin esto, el GITHUB_TOKEN puede venir de solo lectura por default según
# la configuración del repo/organización, y el "git push" del último paso
# falla sin avisar mucho por qué. Lo declaramos acá explícito para no
# depender de esa configuración externa.
permissions:
  contents: write

# Evita que dos ejecuciones se pisen si llegan varios pushes seguidos
# (ej. el cliente sube varias fotos en poco tiempo).
concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    # El propio commit que hace este bot al final tiene "[skip ci]" en el
    # mensaje - sin este check, el workflow se dispararía a sí mismo en
    # loop cada vez que comitea un cambio.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: rename-uploads.mjs necesita poder comparar contra el commit anterior al push, sea cual sea

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de los scripts
        run: npm install sharp glob js-yaml

      - name: Renombrar y versionar reemplazos
        run: node scripts/rename-uploads.mjs
        env:
          DIFF_BASE: ${{ github.event.before }}

      - name: Comprimir imágenes
        run: node scripts/compress-images.mjs
        env:
          DIFF_BASE: ${{ github.event.before }}

      - name: Comprimir videos
        # ffmpeg/ffprobe ya vienen preinstalados en el runner ubuntu-latest
        # de GitHub Actions - no hace falta instalarlos.
        run: node scripts/compress-videos.mjs
        env:
          DIFF_BASE: ${{ github.event.before }}

      - name: Numerar y renombrar deptos nuevos
        run: node scripts/rename-new-deptos.mjs
        env:
          DIFF_BASE: ${{ github.event.before }}

      - name: Sumar deptos nuevos a las listas curadas (carrusel, mapa)
        run: node scripts/sync-nuevos-deptos-en-listas-curadas.mjs
        env:
          DIFF_BASE: ${{ github.event.before }}

      - name: Borrar media sin usar
        # Corre al final de todo el procesamiento (necesita que las
        # referencias ya estén en su forma final) - revisa TODO el
        # contenido, no solo lo que cambió en este push, así que no
        # necesita DIFF_BASE.
        run: node scripts/delete-orphaned-media.mjs

      - name: Commitear cambios (si hubo)
        run: |
          git config user.name "deploy-bot"
          git config user.email "bot@deploystudio.com.ar"
          git add public/departamentos src/data/departamentos public/hero public/inicio public/nosotros public/resenas src/content
          if ! git diff --cached --quiet; then
            git commit -m "chore: organizar y optimizar contenido subido desde el panel [skip ci]"
            # Reintenta el push si "main" avanzó mientras corría este job
            # (ej. alguien de la agencia pusheó al mismo tiempo que el
            # cliente subía algo desde el panel) - sin esto, el commit del
            # bot se pierde entero (nunca llega a GitHub) y hay que volver
            # a correr el workflow a mano. git pull --rebase trae el/los
            # commit(s) nuevos y reaplica el del bot arriba; si hay un
            # conflicto real (mismo archivo, mismas líneas), se corta acá
            # con un error claro en vez de dejar el repo a medio rebasear.
            for intento in 1 2 3 4 5; do
              if git push; then
                echo "Push del bot exitoso (intento $intento)."
                break
              fi
              if [ "$intento" -eq 5 ]; then
                echo "::error::No se pudo pushear el commit del bot después de 5 intentos."
                exit 1
              fi
              echo "Push rechazado (probablemente alguien pusheó mientras corría este job) - reintentando ($intento/5)..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Conflicto real al rebasar - no se puede resolver solo. Requiere revisión manual."
                git rebase --abort
                exit 1
              fi
            done
          else
            echo "Sin cambios para commitear."
          fi
