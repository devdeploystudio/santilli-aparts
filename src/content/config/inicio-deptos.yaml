inicioDeptos:
  id: "inicio-deptos"
  titulo: "Nuestros departamentos"
  texto1: "Tenemos opciones para parejas, personas solas, familias, pacientes del interior, viajes laborales y grupos chicos que buscan una estadía cómoda en zonas estratégicas de CABA."
  texto2: "Una muestra de lo que tenemos disponible en Recoleta y Palermo. Se van sumando departamentos todo el tiempo, consultanos por el que más te interese."
