que-incluye:
  id: "que-incluye"
  fotoFondo: "/inicio/que-incluye-fondo_v02.jpg"
  titulo: "Todo preparado para que ingreses y te sientas cómodo"
  texto: "Nuestros departamentos están equipados para estadías por noche, con lo esencial incluido para que no tengas que preocuparte por nada. Los detalles exactos de cada unidad se confirman por WhatsApp según disponibilidad."
  items:
    - icono: "ropaBlanca"
      titulo: "Ropa blanca"
      texto: "Sábanas, toallas y toallones para que el ingreso sea simple."
    - icono: "wifi"
      titulo: "WiFi incluido"
      texto: "Conexión para trabajar, estudiar o mantenerte comunicado."
    - icono: "tv"
      titulo: "TV"
      texto: "Departamentos equipados con TV y servicios incluidos."
    - icono: "cocina"
      titulo: "Cocina equipada"
      texto: "Vajilla y elementos básicos para resolver comidas durante el día."
    - icono: "aire"
      titulo: "Aire acondicionado"
      texto: "Aire acondicionado en la mayoría de las unidades."
    - icono: "seguridad"
      titulo: "Edificio seguro"
      texto: "Opciones en edificios cuidados y preparados para recibir huéspedes."
    - icono: "amenities"
      titulo: "Amenities"
      texto: "Algunas unidades cuentan con pileta, solarium u otros amenities."
    - icono: "cochera"
      titulo: "Cochera"
      texto: "En algunas unidades puede haber cochera disponible."
