zonas:
  id: "zonas"
  titulo: "Trabajamos en zonas céntricas, prácticas y cercanas a todo."
  texto: "Nuestra propuesta se enfoca principalmente en Recoleta y Palermo, dos zonas muy elegidas de Buenos Aires por su ubicación, movimiento, seguridad y cercanía con clínicas, facultades, comercios, restaurantes, transporte público y avenidas principales."
  zonas:
    - nombre: "Recoleta"
      subtitulo: "Clínicas, facultades y avenidas"
      texto: "Una zona cómoda, segura y muy buscada por quienes necesitan moverse rápido por la ciudad. Ideal para pacientes, familias y estadías cortas, cerca de clínicas, facultades y Av. Santa Fe."
    - nombre: "Palermo"
      subtitulo: "Gastronomía, bares y vida urbana"
      texto: "Moderno y conectado: ideal para quienes quieren estar cerca de restaurantes, bares, transporte y puntos turísticos de la ciudad."
  accesos:
    - icono: "subte"
      texto: "Subte y colectivos a pocas cuadras"
    - icono: "salud"
      texto: "Hospitales y clínicas cercanas"
    - icono: "seguridad"
      texto: "Zonas seguras y muy transitadas"
    - icono: "ubicacion"
      texto: "Conexión rápida con el resto de CABA"
