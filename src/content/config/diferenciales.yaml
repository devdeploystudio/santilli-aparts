diferenciales:
  id: "diferenciales"
  titulo: "Sin seña. Abonás al ingresar."
  texto: "Es el diferencial que más nos preguntan: no vas a transferir nada por adelantado para reservar. Coordinamos todo por WhatsApp y pagás recién cuando llegás al departamento."
  secundario1Titulo: "Amplia disponibilidad"
  secundario1Texto: "Departamentos de 1 a 5 personas. Te ofrecemos alternativas según la cantidad de huéspedes, fechas disponibles, ubicación preferida y estilo de estadía, para que puedas comparar opciones y elegir con tranquilidad."
  secundario2Titulo: "Descuento en efectivo"
  secundario2Texto: "Pagando en efectivo tenés un descuento sobre el valor de la estadía."
  secundario3Titulo: "Atención familiar"
  secundario3Texto: "Somos tres personas, una familia, y siempre te atendemos nosotros, de punta a punta."
  importanteTitulo: "Importante sobre la asignación de departamentos"
  importanteTexto: "En Santilli Aparts trabajamos con una amplia variedad de departamentos en Recoleta y Palermo. Por situaciones excepcionales, especialmente relacionadas con salud o extensiones de estadía de huéspedes ya alojados, la unidad asignada podría modificarse. En ese caso, siempre se ofrecerá otro departamento de características similares, respetando la zona, comodidad y condiciones acordadas."
