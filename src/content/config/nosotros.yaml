nosotros:
  id: "nosotros"
  foto: "../../assets/familia.jpeg"
  titulo: "Somos una familia, no una empresa."
  texto1: "Santilli Aparts lo llevamos adelante nosotros tres, y solo nosotros. No hay call center, ni empleados rotando, ni respuestas automáticas: cada consulta, cada coordinación de ingreso y cada imprevisto lo resolvemos nosotros mismos."
  texto2: "Elegimos que sea así a propósito. Trabajar en familia significa que conocemos cada uno de nuestros departamentos, y que cuando nos escribís, hablás con alguien que realmente puede resolverte algo, no con un intermediario más."
  punto1Titulo: "Chico, a propósito"
  punto1Texto: "No buscamos ser la inmobiliaria más grande de la zona, sino la que mejor te atiende."
  punto2Titulo: "Siempre nosotros"
  punto2Texto: "Desde el primer mensaje hasta el día que te vas, hablás con la misma familia."
  punto3Titulo: "Recoleta y Palermo"
  punto3Texto: "Conocemos bien la zona donde vivimos y trabajamos. Por eso te podemos asesorar de verdad, no solo mostrarte fotos."
