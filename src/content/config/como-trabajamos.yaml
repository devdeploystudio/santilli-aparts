como-trabajamos:
  id: "como-trabajamos"
  titulo: "Cómo trabajamos"
  texto: "Buscamos que el proceso sea claro, directo y sin vueltas. Te acompañamos desde la consulta hasta el ingreso."
  paso1Titulo: "Nos consultás"
  paso1Texto: "Nos escribís por WhatsApp indicando fechas, cantidad de personas y zona de preferencia."
  paso2Titulo: "Te enviamos opciones"
  paso2Texto: "Revisamos disponibilidad y te mostramos departamentos que se adapten a lo que necesitás."
  paso3Titulo: "Elegís tu depto"
  paso3Texto: "Coordinamos horario de ingreso y toda la información necesaria para tu estadía."
  paso4Titulo: "Abonás al ingresar"
  paso4Texto: "No pedimos seña previa: podés abonar directamente al momento del ingreso."
  reservaTitulo: "¿Cómo se reserva?"
  reservaTexto: "Una vez que elegiste tu departamento, coordinamos la reserva por WhatsApp. Para formalizarla vamos a pedirte algunos datos: nombre y apellido, CUIL o CUIT, domicilio y localidad."
