como-trabajamos:
  id: "como-trabajamos"
  titulo: "Cómo trabajamos"
  texto: "Buscamos que el proceso sea claro, directo y sin vueltas. Te acompañamos desde la consulta hasta el ingreso."
  pasos:
    - titulo: "Nos consultás"
      texto: "Nos escribís por WhatsApp indicando fechas, cantidad de personas y zona de preferencia."
    - titulo: "Te enviamos opciones"
      texto: "Revisamos disponibilidad y te mostramos departamentos que se adapten a lo que necesitás."
    - titulo: "Elegís tu depto"
      texto: "Coordinamos horario de ingreso y toda la información necesaria para tu estadía."
    - titulo: "Abonás al ingresar"
      texto: "No pedimos seña previa: podés abonar directamente al momento del ingreso."
  reservaTitulo: "¿Cómo se reserva?"
  reservaTexto: "Una vez que elegiste tu departamento, coordinamos la reserva por WhatsApp. Para formalizarla vamos a pedirte algunos datos: nombre y apellido, CUIL o CUIT, domicilio y localidad."
