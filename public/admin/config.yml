backend:
  name: github
  repo: devdeploystudio/santilli-aparts
  branch: main
  # Proxy de login por GitHub OAuth (Cloudflare Worker sveltia-cms-auth).
  # Mismo Worker que usan todos los sitios de Deploy: solo hace falta sumar
  # el dominio de este sitio a ALLOWED_DOMAINS en esa única instancia.
  base_url: https://sveltia-cms-auth.contact-deploystudio.workers.dev

# Nota: `local_backend: true` (la forma de Decap CMS de probar en local sin
# loguearse) NO existe en Sveltia - la propia consola avisa "not supported,
# will be ignored" si se lo deja puesto. Sveltia trae su modo local propio
# ("Trabajar con un repositorio local" en la pantalla de login) sin
# necesitar ningún flag acá - no hace falta (ni sirve) declararlo.

media_folder: "src/assets"
public_folder: "src/assets"

# Preview apagado por default (formulario a todo el ancho, ver Paso 2 de la
# guía) - prendido puntualmente con `editor: { preview: true }` en las
# colecciones que SÍ tienen su propio template en preview.js. Sin esto,
# Sveltia muestra un panel de vista previa en vivo al lado del formulario y
# los campos de texto quedan comprimidos a la mitad del ancho de la pantalla.
editor:
  preview: false

# El orden de la lista de acá abajo es a propósito el mismo orden en que
# esos bloques aparecen scrolleando la página real (home primero de
# arriba a abajo, después Nosotros y Departamentos como páginas aparte,
# General al final) - así el cliente puede ir bajando por el sitio y
# encontrar cada sección en el mismo orden en el panel, sin tener que
# adivinar dónde quedó cada cosa.
collections:
  # TODO lo de la home usa el prefijo "🏠 Inicio →", aunque cada bloque
  # sea su propia colección de Sveltia (no soporta carpetas anidadas de
  # verdad) - así se ven agrupados uno al lado del otro en la lista de la
  # izquierda, y le queda clarísimo al cliente que todo esto es "la
  # página de Inicio". Ninguna usa la palabra técnica "Hero": para el
  # cliente esto es "la portada", la primera pantalla que se ve al entrar.
  - name: "config-inicio-portada-texto"
    label: "🏠 Inicio → Portada (texto)"
    description: "El título grande, el párrafo de abajo y los 2 botones, en la primera pantalla de la home. El párrafo se arma en 7 partes en el orden en que aparecen abajo, para que las 3 frases resaltadas queden siempre subrayadas con la animación."
    editor: { preview: true }
    files:
      - name: "inicio-hero"
        label: "Texto de la portada"
        file: "src/content/config/inicio-hero.yaml"
        fields:
          - label: "Portada"
            name: "inicioHero"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-hero" }
              - { label: "Título principal", name: "heroTitulo", widget: "text" }
              - { label: "1. Texto inicial", name: "heroPre", widget: "string", hint: "Ej: \"Contamos con\"" }
              - label: "2. Frase resaltada"
                name: "heroDestacado1"
                widget: "string"
                hint: "Sale subrayada con una animación. Ej: \"más de 60 departamentos\""
              - { label: "3. Texto siguiente", name: "heroEntre1", widget: "string", hint: "Ej: \"en Recoleta y Palermo, para\"" }
              - { label: "4. Frase resaltada", name: "heroDestacado2", widget: "string", hint: "Ej: \"1 a 5 personas\"" }
              - { label: "5. Texto siguiente", name: "heroEntre2", widget: "string", hint: "Ej: \"y no pedimos seña:\"" }
              - { label: "6. Frase resaltada", name: "heroDestacado3", widget: "string", hint: "Ej: \"abonás al ingresar\"" }
              - { label: "7. Resto del párrafo", name: "heroFinal", widget: "text" }
              - { label: "Botón 1: texto", name: "botonWhatsappTexto", widget: "string", hint: "Este botón siempre lleva a WhatsApp - acá solo se edita el texto que dice, no el destino." }
              - { label: "Botón 2: texto", name: "botonDeptosTexto", widget: "string", hint: "Este botón siempre lleva al listado de departamentos - acá solo se edita el texto que dice, no el destino." }

  - name: "config-inicio-portada-fotos"
    label: "🏠 Inicio → Portada (fotos)"
    description: "Las fotos y videos que van pasando solos en la primera pantalla de la home. Se pueden agregar, borrar y reordenar arrastrando."
    files:
      - name: "inicio-fotos"
        label: "Fotos de la portada"
        file: "src/content/config/inicio-fotos.yaml"
        fields:
          - label: "Fotos"
            name: "inicioFotos"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-fotos" }
              - label: "Fotos y videos (van pasando solas)"
                name: "heroSlides"
                widget: "list"
                hint: "Se pueden agregar, borrar y reordenar arrastrando. Admite foto o video en el mismo campo (se detecta por la extensión del archivo)."
                summary: "{{archivo}}"
                field:
                  label: "Elemento"
                  name: "slide"
                  widget: "object"
                  fields:
                    - { label: "Foto o video", name: "archivo", widget: "file", media_folder: "/public/hero", public_folder: "/hero" }
                    - { label: "Portada del video (opcional, solo si es un video)", name: "poster", widget: "image", required: false, media_folder: "/public/hero", public_folder: "/hero" }

  - name: "config-inicio-deptos"
    label: "🏠 Inicio → Nuestros departamentos"
    description: "El título y los 2 párrafos de arriba del carrusel de departamentos, en la home."
    editor: { preview: true }
    files:
      - name: "inicio-deptos"
        label: "Nuestros departamentos"
        file: "src/content/config/inicio-deptos.yaml"
        fields:
          - label: "Nuestros departamentos"
            name: "inicioDeptos"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-deptos" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Primer párrafo", name: "texto1", widget: "text" }
              - { label: "Segundo párrafo", name: "texto2", widget: "text" }

  - name: "config-inicio-ayuda"
    label: "🏠 Inicio → Ayuda a elegir"
    description: "El bloque \"¿Ya sabés cuándo necesitás alojamiento?\", con el formulario de ayuda, en la home. Los puntos de la lista se pueden agregar, borrar y reordenar arrastrando."
    editor: { preview: true }
    files:
      - name: "inicio-ayuda"
        label: "Ayuda a elegir"
        file: "src/content/config/inicio-ayuda.yaml"
        fields:
          - label: "Ayuda a elegir"
            name: "inicioAyuda"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-ayuda" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - label: "Puntos de la lista (con tilde ✓)"
                name: "items"
                widget: "list"
                hint: "Se pueden agregar, borrar y reordenar arrastrando."
                summary: "{{fields.texto}}"
                fields:
                  - { label: "Punto", name: "texto", widget: "string" }

  - name: "config-inicio-diferenciales"
    label: "🏠 Inicio → Diferenciales"
    description: "El bloque \"Sin seña\", las tarjetas secundarias y el aviso sobre asignación de departamentos, en la home. Las tarjetas se pueden agregar, borrar y reordenar arrastrando."
    editor: { preview: true }
    files:
      - name: "diferenciales"
        label: "Diferenciales"
        file: "src/content/config/diferenciales.yaml"
        fields:
          - label: "Diferenciales"
            name: "diferenciales"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "diferenciales" }
              - { label: "Foto de fondo del bloque", name: "fotoFondo", widget: "image", media_folder: "/public/inicio", public_folder: "/inicio", hint: "Ocupa todo el fondo de la sección, con un velo oscuro atrás del texto." }
              - { label: "Título principal", name: "titulo", widget: "string" }
              - { label: "Texto principal", name: "texto", widget: "text" }
              - label: "Tarjetas secundarias"
                name: "cards"
                widget: "list"
                hint: "Se pueden agregar, borrar y reordenar arrastrando. El dibujo de cada tarjeta es decorativo y lo pone el diseño solo (rota según el orden), no se elige acá."
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Título del aviso de asignación", name: "importanteTitulo", widget: "string" }
              - { label: "Texto del aviso de asignación", name: "importanteTexto", widget: "text" }

  - name: "config-inicio-zonas"
    label: "🏠 Inicio → Zonas"
    description: "El bloque de zonas (Recoleta/Palermo) y los accesos, en la home. Las tarjetas de zona y los accesos se pueden agregar, borrar y reordenar arrastrando, cada lista por separado."
    editor: { preview: true }
    files:
      - name: "zonas"
        label: "Zonas"
        file: "src/content/config/zonas.yaml"
        fields:
          - label: "Zonas"
            name: "zonas"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "zonas" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Bajada", name: "texto", widget: "text" }
              - label: "Tarjetas de zona"
                name: "zonas"
                widget: "list"
                hint: "Se pueden agregar, borrar y reordenar arrastrando (ej: sumar una tarjeta de Balvanera más adelante)."
                summary: "{{fields.nombre}}"
                fields:
                  - { label: "Nombre (ej: \"Recoleta\")", name: "nombre", widget: "string" }
                  - { label: "Subtítulo", name: "subtitulo", widget: "string" }
                  - { label: "Texto", name: "texto", widget: "text" }
              - label: "Accesos (la lista de abajo de todo, con ícono)"
                name: "accesos"
                widget: "list"
                hint: "Se pueden agregar, borrar y reordenar arrastrando."
                summary: "{{fields.texto}}"
                fields:
                  - { label: "Ícono", name: "icono", widget: "icon-picker" }
                  - { label: "Texto", name: "texto", widget: "string" }

  - name: "config-inicio-que-incluye"
    label: "🏠 Inicio → Qué incluye"
    description: "Los servicios que se muestran en la home. Se pueden agregar, borrar y reordenar arrastrando."
    editor: { preview: true }
    files:
      - name: "que-incluye"
        label: "Qué incluye"
        file: "src/content/config/que-incluye.yaml"
        fields:
          - label: "Qué incluye"
            name: "que-incluye"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "que-incluye" }
              - { label: "Foto de fondo del bloque", name: "fotoFondo", widget: "image", media_folder: "/public/inicio", public_folder: "/inicio", hint: "Ocupa todo el fondo de la sección, con un velo oscuro atrás del texto." }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Bajada", name: "texto", widget: "text" }
              - label: "Servicios"
                name: "items"
                widget: "list"
                hint: "Se pueden agregar, borrar y reordenar arrastrando."
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Ícono", name: "icono", widget: "icon-picker" }
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto", name: "texto", widget: "text" }

  - name: "config-inicio-como-se-reserva"
    label: "🏠 Inicio → Cómo se reserva"
    description: "Los pasos del proceso, en la home (mismo bloque al que apunta \"Cómo se reserva\" del menú del sitio). Los pasos se pueden agregar, borrar y reordenar arrastrando; se numeran solos."
    editor: { preview: true }
    files:
      - name: "como-trabajamos"
        label: "Cómo se reserva"
        file: "src/content/config/como-trabajamos.yaml"
        fields:
          - label: "Cómo se reserva"
            name: "como-trabajamos"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "como-trabajamos" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Bajada", name: "texto", widget: "text" }
              - label: "Pasos"
                name: "pasos"
                widget: "list"
                hint: "Se pueden agregar, borrar y reordenar arrastrando. El número (01, 02...) lo pone el diseño solo según el orden, no se escribe acá."
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Título del cartel \"¿Cómo se reserva?\"", name: "reservaTitulo", widget: "string" }
              - { label: "Texto del cartel \"¿Cómo se reserva?\"", name: "reservaTexto", widget: "text" }

  - name: "config-inicio-resenas"
    label: "🏠 Inicio → Reseñas"
    label_singular: "Reseña"
    description: "Las reseñas de huéspedes que aparecen en la home. Agregá, borrá o reordená las que quieras."
    folder: "src/content/resenas"
    create: true
    delete: true
    extension: "yaml"
    format: "yaml"
    identifier_field: zona
    reorder: { key: orden }
    fields:
      - { label: "Captura de WhatsApp", name: "imagen", widget: "image", media_folder: "/public/resenas", public_folder: "/resenas", hint: "Recorte de la conversación real con el huésped. Se muestra tal cual (no se edita el color), enmarcada con los colores del sitio." }
      - { label: "Quién la dejó (ej: \"Huésped en Recoleta\")", name: "zona", widget: "string" }
      - { label: "Texto (para lectores de pantalla, no se ve)", name: "texto", widget: "text", hint: "Escribí lo mismo que dice la captura: no se muestra en la tarjeta, pero lo necesitan los lectores de pantalla." }

  - name: "config-inicio-final"
    label: "🏠 Inicio → Bloque final"
    description: "El último cartel de la home (\"¿Ya sabés qué fechas necesitás?\"), con su foto de fondo y su botón."
    editor: { preview: true }
    files:
      - name: "inicio-cta"
        label: "Bloque final"
        file: "src/content/config/inicio-cta.yaml"
        fields:
          - label: "Bloque final"
            name: "inicioCta"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "inicio-cta" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Imagen de fondo", name: "foto", widget: "image", media_folder: "/public/inicio", public_folder: "/inicio" }
              - { label: "Botón: texto", name: "botonTexto", widget: "string", hint: "Este botón siempre lleva al listado de departamentos - acá solo se edita el texto que dice, no el destino." }

  - name: "config-nosotros"
    label: "👨‍👩‍👦 Nosotros"
    description: "La foto de familia, el título, los párrafos y los puntos de la página \"Nosotros\". Los puntos se pueden agregar, borrar y reordenar arrastrando."
    editor: { preview: true }
    files:
      - name: "nosotros"
        label: "Textos de Nosotros"
        file: "src/content/config/nosotros.yaml"
        fields:
          - label: "Nosotros"
            name: "nosotros"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "nosotros" }
              - { label: "Foto de familia", name: "foto", widget: "image", media_folder: "/public/nosotros", public_folder: "/nosotros" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Primer párrafo", name: "texto1", widget: "text" }
              - { label: "Segundo párrafo", name: "texto2", widget: "text" }
              - label: "Puntos"
                name: "puntos"
                widget: "list"
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Ícono", name: "icono", widget: "icon-picker" }
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto", name: "texto", widget: "text" }

  # Catálogos chicos de referencia para Departamentos (ver el widget
  # "relation" en la colección de acá abajo): agregar una entrada nueva
  # ahí la deja disponible como opción para elegir en cualquier
  # departamento, sin tocar código. Van justo antes de "Departamentos"
  # porque solo existen para alimentarla.
  - name: "zonas-disponibles"
    label: "🏢 Departamentos → Zonas disponibles"
    label_singular: "Zona"
    description: "Las zonas que se pueden elegir al cargar un departamento. Agregá una acá para que aparezca como opción nueva."
    folder: "src/data/zonas-disponibles"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: nombre
    fields:
      - { label: "Nombre (ej: \"Recoleta\")", name: "nombre", widget: "string" }

  - name: "servicios-disponibles"
    label: "🏢 Departamentos → Servicios disponibles"
    label_singular: "Servicio"
    description: "Los servicios que se pueden marcar al cargar un departamento (y sus íconos). Agregá uno acá para que aparezca como opción nueva."
    folder: "src/data/servicios-disponibles"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: nombre
    fields:
      - { label: "Ícono", name: "icono", widget: "icon-picker" }
      - { label: "Nombre (ej: \"WiFi incluido\")", name: "nombre", widget: "string" }

  - name: "departamentos"
    label: "🏢 Departamentos"
    label_singular: "Departamento"
    description: "Los departamentos que aparecen en el listado, el carrusel de la home y su propia ficha."
    folder: "src/data/departamentos"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: nombre
    fields:
      - { label: "Nombre", name: "nombre", widget: "string" }
      - label: "Zona"
        name: "zona"
        widget: "relation"
        collection: "zonas-disponibles"
        search_fields: ["nombre"]
        display_fields: ["{{nombre}}"]
        value_field: "nombre"
        hint: "Si la zona que buscás no está en la lista, agregala primero en \"Departamentos → Zonas disponibles\" y volvé acá - va a aparecer en el próximo departamento que edites o crees."
      - { label: "Dirección", name: "direccion", widget: "string" }
      - label: "Ubicación en el mapa"
        name: "coords"
        widget: "object"
        fields:
          - { label: "Latitud", name: "lat", widget: "number", value_type: "float" }
          - { label: "Longitud", name: "lng", widget: "number", value_type: "float" }
      - { label: "Capacidad mínima (personas)", name: "capacidadMin", widget: "number", value_type: "int" }
      - { label: "Capacidad máxima (personas)", name: "capacidadMax", widget: "number", value_type: "int" }
      - { label: "Descripción", name: "descripcionBreve", widget: "text" }
      - label: "Servicios incluidos"
        name: "servicios"
        widget: "relation"
        collection: "servicios-disponibles"
        search_fields: ["nombre"]
        display_fields: ["{{nombre}}"]
        value_field: "{{slug}}"
        multiple: true
        hint: "Si el servicio que buscás no está en la lista, agregalo primero en \"Departamentos → Servicios disponibles\" (con su ícono) y volvé acá - va a aparecer en el próximo departamento que edites o crees."
      - label: "Fotos y videos"
        name: "media"
        widget: "list"
        hint: "Se pueden agregar, borrar y reordenar arrastrando - las fotos y los videos van todos en la misma lista, en el orden que quieras (podés poner un video primero, al final, o entre dos fotos)."
        summary: "{{archivo}}"
        field:
          label: "Elemento"
          name: "elemento"
          widget: "object"
          fields:
            - { label: "Foto o video", name: "archivo", widget: "file", media_folder: "/public/departamentos/{{slug}}", public_folder: "/departamentos/{{slug}}" }
            - { label: "Portada del video (opcional, solo si es un video)", name: "poster", widget: "image", required: false, media_folder: "/public/departamentos/{{slug}}", public_folder: "/departamentos/{{slug}}" }
      - label: "Portada de la tarjeta (opcional)"
        name: "portada"
        widget: "file"
        required: false
        hint: "Se usa en el carrusel de la home y en el listado de departamentos. Admite foto o video. Si se deja vacío, se usa el primer elemento de \"Fotos y videos\" de arriba."
        media_folder: "/public/departamentos/{{slug}}"
        public_folder: "/departamentos/{{slug}}"

  - name: "config"
    label: "⚙️ General"
    description: "El número de WhatsApp que se usa en todos los botones de consulta del sitio."
    files:
      - name: "site"
        label: "Configuración general"
        file: "src/content/config/site.yaml"
        fields:
          - label: "Sitio"
            name: "site"
            widget: "object"
            fields:
              - { label: "ID (no tocar)", name: "id", widget: "hidden", default: "site" }
              - { label: "WhatsApp (solo números, con código de país, ej: 5491122334455)", name: "whatsappNumero", widget: "string", required: false }
              - { label: "Instagram (link completo, ej: https://www.instagram.com/usuario/)", name: "instagramUrl", widget: "string", required: false }
